name: p4-wireshark
services:
  wireshark:
    image: lscr.io/linuxserver/wireshark:4.6.6-r0-ls330
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./pcap:/pcap:ro      # записи трафика — только для чтения
    shm_size: "1gb"          # память для показа окна в браузере
