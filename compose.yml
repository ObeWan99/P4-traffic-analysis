# Wireshark для практики 4: открывается в браузере — вкладка Ports, порт 3000.
# Сеть — как в П1–П3: network_mode: host (в Codespace сеть Docker ведёт себя ненадёжно).
# На своём компьютере или ВМ Wireshark будет открыт всей сети без пароля — задайте
# переменные CUSTOM_USER и PASSWORD. В Codespace порты видит только владелец.
name: p4-wireshark
services:
  wireshark:
    image: lscr.io/linuxserver/wireshark:4.6.6-r0-ls330
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./pcap:/pcap:ro      # записи трафика — только для чтения
    shm_size: "1gb"          # память для показа окна в браузере
